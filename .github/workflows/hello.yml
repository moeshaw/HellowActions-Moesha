
# Name displayed in GitHub Actions
name: Hello World with Python

# Events that trigger the workflow
on:
 # Run when code is pushed to main
  push:
    branches:
      - main
# Allow manual execution
  workflow_dispatch:

# Define the jobs
jobs:
 # First job: Ubuntu
  hello-python:
    name: Run Python on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run the Python program
        env:
          WHO_TO_GREET: 'GitHub Actions Student'
        run: python hello.py

  # Second job: Windows
  hello-python-windows:
    name: Run Python on Windows
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run the Python program
        env:
          WHO_TO_GREET: 'GitHub Actions Student'
        run: python hello.py

      # Execute the Python program
      - name: Run the Python program
        env:
          WHO_TO_GREET: 'GitHub Actions Student'
        run: python hello.py
